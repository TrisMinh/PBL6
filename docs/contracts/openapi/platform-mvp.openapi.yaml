      x-permission: tenant.booking.read-or-platform.support.read
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: organizationId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, maxLength: 30}}
        - name: search
          in: query
          description: Case-insensitive substring of booking code, contact name, or ID.
          schema: {type: string, maxLength: 100}
        - name: matchingOrganizationId
          in: query
          description: Organization IDs matching the search text, combined with the text search within the authorized scope.
          schema: {type: array, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '200': {description: Bookings, content: {application/json: {schema: {$ref: '#/components/schemas/BookingPage'}}}}
        default: {$ref: '#/components/responses/Error'}
