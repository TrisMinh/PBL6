    Ticket:
      type: object
      required: [id, publicCode, bookingId, tripId, passengerName, seatCode, status, paymentChannel, issuedAt, rowVersion]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        publicCode: {type: string}
        bookingId: {$ref: '#/components/schemas/Id'}
        tripId: {$ref: '#/components/schemas/Id'}
        passengerName: {type: string}
        seatCode: {type: string}
        status: {type: string, enum: [ISSUED, CHECKED_IN, USED, CANCELLED, REFUNDED]}
        paymentChannel: {type: string, enum: [PREPAID, PAY_LATER]}
        qrPayload: {type: [string, 'null'], description: Signed/opaque; only returned to authorized owner.}
        refundRequestId: {type: string, format: uuid}
        issuedAt: {$ref: '#/components/schemas/DateTime'}
        checkedInAt: {oneOf: [{$ref: '#/components/schemas/DateTime'}, {type: 'null'}]}
        journey:
          description: Booking and seat references returned in owner-scoped lists.
          type: object
          required: [bookingCode, seatId, pickupStopId, dropoffStopId]
          properties:
            bookingCode: {type: string}
            bookingStatus: {type: [string, 'null']}
            seatId: {$ref: '#/components/schemas/Id'}
            pickupStopId: {$ref: '#/components/schemas/Id'}
            dropoffStopId: {$ref: '#/components/schemas/Id'}
        rowVersion: {type: integer, format: int64}
    TicketPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}}}
    TicketScanRequest:
      type: object
      required: [tripId, scannedToken, expectedVersion]
      properties:
        tripId: {$ref: '#/components/schemas/Id'}
        scannedToken: {type: string, minLength: 8, maxLength: 500, writeOnly: true}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    TicketValidation:
      type: object
      required: [valid, reasonCode, ticket]
      properties:
        valid: {type: boolean}
        reasonCode: {type: [string, 'null']}
        ticket: {oneOf: [{$ref: '#/components/schemas/Ticket'}, {type: 'null'}]}
    Manifest:
      type: object
      required: [tripId, generatedAt, passengers]
      properties:
        tripId: {$ref: '#/components/schemas/Id'}
        generatedAt: {$ref: '#/components/schemas/DateTime'}
        passengers:
          type: array
          items:
            type: object
            required: [ticketId, passengerName, seatCode, pickupStopName, status]
            properties:
              ticketId: {$ref: '#/components/schemas/Id'}
              passengerName: {type: string}
              seatCode: {type: string}
              pickupStopName: {type: string}
              status: {type: string}
    Notification:
      type: object
      required: [id, type, title, body, read, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        referenceType: {type: [string, 'null']}
        referenceId: {type: [string, 'null']}
        read: {type: boolean}
        createdAt: {$ref: '#/components/schemas/DateTime'}
    NotificationPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        nextCursor: {type: [string, 'null']}
    Report:
      type: object
      required: [data, generatedAt, dataAsOf, timezone, metricDefinitions]
      properties:
        data: {type: array, items: {type: object, additionalProperties: true}}
        generatedAt: {$ref: '#/components/schemas/DateTime'}
        dataAsOf: {$ref: '#/components/schemas/DateTime'}
        timezone: {type: string}
        metricDefinitions: {type: object, additionalProperties: {type: string}}
    RevenueReport:
      type: object
      required: [data, generatedAt, dataAsOf, timezone, metricDefinitions]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/RevenueDay'}}
        generatedAt: {$ref: '#/components/schemas/DateTime'}
        dataAsOf: {type: [string, 'null'], format: date-time, description: Latest projection write in the selected results. Null when empty.}
        timezone: {const: Asia/Ho_Chi_Minh}
        metricDefinitions: {type: object, additionalProperties: {type: string}}
    RevenueDay:
      type: object
      required: [organizationId, periodDate, currency, grossRevenue, refundAmount, netRevenue, platformCommission, operatorPayable, unsettledAmount, paymentCount, refundCount, dataAsOf]
      properties:
        organizationId: {type: string, format: uuid}
        periodDate: {type: string, format: date}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        grossRevenue: {type: integer, format: int64, minimum: 0}
        refundAmount: {type: integer, format: int64, minimum: 0}
        netRevenue: {type: integer, format: int64, description: Gross captures minus refunds in the period.}
        platformCommission: {type: integer, format: int64, description: Net recorded change in platform commission.}
        operatorPayable: {type: integer, format: int64, description: Net recorded change in operator payable before payout.}
        unsettledAmount: {type: integer, format: int64, description: Net collection minus commission and operator payable movements.}
        paymentCount: {type: integer, format: int64, minimum: 0}
        refundCount: {type: integer, format: int64, minimum: 0}
        dataAsOf: {$ref: '#/components/schemas/DateTime'}
