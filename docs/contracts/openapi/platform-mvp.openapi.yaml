        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripIds]
              properties:
                tripIds: {type: array, minItems: 1, maxItems: 1000, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Available seats keyed by trip ID
          content: {application/json: {schema: {type: object, additionalProperties: {type: integer, minimum: 0}}}}
        default: {$ref: '#/components/responses/Error'}
