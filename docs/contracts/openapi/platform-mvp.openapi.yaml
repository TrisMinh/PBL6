        - {name: bookingId, in: query, schema: {type: array, maxItems: 100, items: {type: string, format: uuid}}}
        - {name: from, in: query, description: Inclusive local creation date in Vietnam., schema: {type: string, format: date}}
        - {name: to, in: query, description: Inclusive local creation date in Vietnam., schema: {type: string, format: date}}
        - {name: operatorStatus, in: query, schema: {type: string, enum: [confirmed, pending, cancelled]}}
        - {name: operatorPayment, in: query, schema: {type: string, enum: [paid, unpaid, refunded]}}
        - {name: settlementReferences, in: query, description: Booking ID, code and creation time for the active operator's settlement list., schema: {type: boolean, default: false}}
