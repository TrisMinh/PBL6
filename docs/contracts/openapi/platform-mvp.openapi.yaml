                fullName: {type: string, minLength: 2, maxLength: 120}
                email: {type: string, format: email}
                phone: {type: string, pattern: '^0[0-9]{9}$'}
                role: {type: string, default: DRIVER, enum: [DRIVER, OPERATOR_ADMIN, OPERATOR_SCHEDULER, OPERATOR_OPERATIONS, OPERATOR_FINANCE]}
                initialPassword: {type: string, format: password, writeOnly: true, minLength: 10, maxLength: 128}
