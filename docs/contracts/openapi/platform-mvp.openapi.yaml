openapi: 3.1.0
info:
  title: PBL6 Bus Ticket Platform MVP API
  version: 2.1.0
  description: Active MUST-only HTTP contract for ASP.NET Core services behind YARP.
  license:
    name: Academic project - all rights reserved
    identifier: LicenseRef-Academic-All-Rights-Reserved
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Public authentication and session lifecycle.
  - name: Profile
    description: Current-user profile operations.
  - name: AdminIdentity
    description: Platform user, role and membership administration.
  - name: Trips
    description: Public trip search and detail.
  - name: Operator
    description: Tenant-scoped transport operations.
  - name: Driver
    description: Assigned-driver trip and check-in operations.
  - name: Booking
    description: Seat hold, booking and cancellation operations.
  - name: Tickets
    description: Customer ticket and authorized validation operations.
  - name: Payments
    description: Payment intent, status, administration and provider callbacks.
  - name: Refunds
    description: Refund request, status and administration.
  - name: Notifications
    description: In-app notification inbox operations.
  - name: Reports
    description: Scoped online MVP reporting operations.
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a customer account
      security: []
      requestBody: {$ref: '#/components/requestBodies/Register'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyRegistration
      summary: Verify a registration email challenge
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Verification'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        default: {$ref: '#/components/responses/Error'}
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the registration verification email
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email or phone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        default: {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate a refresh token and renew the session
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh session
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Error'}
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset a password with a valid challenge
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Password changed and sessions revoked}
        default: {$ref: '#/components/responses/Error'}
  /users/me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Get the current user profile
      responses:
        '200':
          description: Current profile
          content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Update the current user profile
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProfileRequest'}}}
      responses:
        '200':
          description: Profile updated
          content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /users/me/phone-verification:
    post:
      tags: [Profile]
      operationId: sendPhoneVerification
      summary: Send an SMS verification code to the signed-in customer's profile number
      responses:
        '202':
          description: SMS submitted
          content: {application/json: {schema: {type: object, required: [challengeId], properties: {challengeId: {type: string, format: uuid}}}}}
        '204': {description: Number already verified}
        default: {$ref: '#/components/responses/Error'}
  /users/me/phone-verification/verify:
    post:
      tags: [Profile]
      operationId: verifyPhone
      summary: Verify the signed-in customer's phone using a single-use SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: {type: string, format: uuid}
                code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
      responses:
        '204': {description: Phone verified. Refresh the session before retrying a seat hold.}
        default: {$ref: '#/components/responses/Error'}
  /users/me/password:
    post:
      tags: [Auth]
      operationId: changeMyPassword
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 128}
                newPassword: {type: string, format: password, writeOnly: true, minLength: 10, maxLength: 128}
      responses:
        '204': {description: Password changed and existing sessions revoked}
        default: {$ref: '#/components/responses/Error'}
  /admin/users:
    get:
      tags: [AdminIdentity]
      operationId: listUsers
      summary: List platform users in the permitted scope
      x-permission: platform.user.read
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: organizationId, in: query, schema: {type: string, format: uuid}}
        - name: search
          in: query
          description: Case-insensitive substring of name, email, or phone.
          schema: {type: string, maxLength: 254}
        - name: staffOnly
          in: query
          description: Include staff roles only, scoped to the organization when supplied.
          schema: {type: boolean, default: false}
        - name: active
          in: query
          description: Filter by whether the account is active.
          schema: {type: boolean}
        - name: membershipActive
          in: query
          description: Filter by whether membership is active. Requires organizationId.
          schema: {type: boolean}
      responses:
        '200':
          description: User page
          content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{userId}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    get:
      tags: [AdminIdentity]
      operationId: getUser
      summary: Get a platform user
      x-permission: platform.user.read
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUser'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{userId}/status:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    patch:
      tags: [AdminIdentity]
      operationId: changeUserStatus
      summary: Change a user account status
      x-permission: platform.user.manage
      requestBody: {$ref: '#/components/requestBodies/VersionedStatus'}
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUser'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{userId}/roles:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    put:
      tags: [AdminIdentity]
      operationId: replaceUserRoles
      summary: Replace the assigned roles of a user
      x-permission: platform.role.manage
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceRolesRequest'}}}
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUser'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/organizations/{organizationId}/members:
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      tags: [AdminIdentity]
      operationId: listMemberships
      summary: List organization memberships
      x-permission: platform.membership.read
      responses:
        '200': {description: Memberships, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Membership'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [AdminIdentity]
      operationId: addMembership
      summary: Add an organization membership
      x-permission: platform.membership.manage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MembershipInput'}}}
      responses:
        '201': {description: Membership, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: membershipId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    patch:
      tags: [AdminIdentity]
      operationId: changeMembership
      summary: Change an organization membership
      x-permission: platform.membership.manage
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MembershipInput'}}}
      responses:
        '200': {description: Membership, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trips:
    get:
      tags: [Trips]
      operationId: searchTrips
      summary: Search sellable trips
      security: []
      parameters:
        - {name: origin, in: query, schema: {type: string, minLength: 1}}
        - {name: destination, in: query, schema: {type: string, minLength: 1}}
        - {name: departureDate, in: query, schema: {type: string, format: date}}
        - {name: passengerCount, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 10}}
        - {name: minPrice, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: maxPrice, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: departureTimeFrom, in: query, schema: {type: string, format: time}}
        - {name: departureTimeTo, in: query, schema: {type: string, format: time}}
        - {name: organizationId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: busType, in: query, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: pickupStopId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: dropoffStopId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: amenities, in: query, schema: {type: array, uniqueItems: true, maxItems: 20, items: {type: string, minLength: 1, maxLength: 50}}, style: form, explode: false}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/TripSort'}}
        - name: cards
          in: query
          description: Returns compact card data for all matching trips with stops grouped by route. Page and size apply to the default representation.
          schema: {type: boolean, default: false}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Trip page, or compact card data when cards is true
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/TripPage'}
                  - {$ref: '#/components/schemas/TripCards'}
        default: {$ref: '#/components/responses/Error'}
  /trips/details:
    get:
      tags: [Trips]
      operationId: getPublicTripDetailsBatch
      summary: Read public trip details for known trip IDs
      security: []
      parameters:
        - {name: ids, in: query, required: true, style: form, explode: false, schema: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Id'}}}
      responses:
        '200': {description: Existing public trip details, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Trip'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /trips/{tripId}:
    parameters: [{$ref: '#/components/parameters/TripId'}]
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Get public trip details
      security: []
      responses:
        '200': {description: Trip, content: {application/json: {schema: {$ref: '#/components/schemas/Trip'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trips/{tripId}/stops:
    parameters: [{$ref: '#/components/parameters/TripId'}]
    get:
      tags: [Trips]
      operationId: getTripStops
      summary: List stops and pickup or drop-off rules for a trip
      security: []
      responses:
        '200': {description: Stops, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TripStop'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /trips/{tripId}/seats:
    parameters: [{$ref: '#/components/parameters/TripId'}]
    get:
      tags: [Booking]
      operationId: getTripSeats
      summary: Get current seat availability for a trip
      responses:
        '200': {description: Seats, content: {application/json: {schema: {$ref: '#/components/schemas/TripSeatList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trips/{tripId}/seat-holds:
    parameters: [{$ref: '#/components/parameters/TripId'}]
    post:
      tags: [Booking]
      operationId: createSeatHold
      summary: Atomically hold selected seats
      description: At most one active hold and four unpaid seats per account per trip. After four explicit session cancellations on that trip in 30 minutes, a five-minute cooldown applies.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSeatHoldRequest'}}}
      responses:
        '201': {description: Hold, content: {application/json: {schema: {$ref: '#/components/schemas/SeatHold'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trips/{tripId}/seat-holds/current:
    parameters: [{$ref: '#/components/parameters/TripId'}]
    get:
      tags: [Booking]
      operationId: findActiveSeatHold
      summary: Resume the signed-in customer's active hold on the trip
      description: Returns the original expiry and held seats. The recovery token works on owned hold and booking APIs.
      responses:
        '200': {description: Active hold, content: {application/json: {schema: {$ref: '#/components/schemas/SeatHold'}}}}
        '204': {description: The customer has no active hold on the trip}
        default: {$ref: '#/components/responses/Error'}
  /seat-holds/{holdToken}:
    parameters: [{$ref: '#/components/parameters/HoldToken'}]
    get:
      tags: [Booking]
      operationId: getSeatHold
      summary: Get an owned seat hold by opaque token
      responses:
        '200': {description: Hold, content: {application/json: {schema: {$ref: '#/components/schemas/SeatHold'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Booking]
      operationId: releaseSeatHold
      summary: Release an owned seat hold
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: cancelSession, in: query, schema: {type: boolean, default: false}, description: Record an explicit customer cancellation when true.}
      responses:
        '204': {description: Released or already terminal}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Booking]
      operationId: replaceSeatHold
      summary: Replace the selected seats without ending or extending the hold
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatIds, pickupStopId, dropoffStopId]
              properties:
                seatIds: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
                pickupStopId: {$ref: '#/components/schemas/Id'}
                dropoffStopId: {$ref: '#/components/schemas/Id'}
      responses:
        '200': {description: Updated hold, content: {application/json: {schema: {$ref: '#/components/schemas/SeatHold'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bookings:
    post:
      tags: [Booking]
      operationId: createBooking
      summary: Create a booking from an active seat hold
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateBookingRequest'}}}
      responses:
        '201': {description: Booking, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        default: {$ref: '#/components/responses/Error'}
    get:
      tags: [Booking]
      operationId: listMyBookings
      summary: List bookings owned by the current customer
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: Booking page, content: {application/json: {schema: {$ref: '#/components/schemas/BookingPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bookings/by-code/{code}:
    get:
      tags: [Booking]
      operationId: getMyBookingByCode
      summary: Read an owned booking by its public code
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
      responses:
        '200': {description: Owned booking, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bookings/{bookingId}:
    parameters: [{$ref: '#/components/parameters/BookingId'}]
    get:
      tags: [Booking]
      operationId: getMyBooking
      summary: Get an owned booking
      responses:
        '200': {description: Booking, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bookings/{bookingId}/cancellation-preview:
    parameters: [{$ref: '#/components/parameters/BookingId'}]
    post:
      tags: [Booking]
      operationId: previewCancellation
      summary: Preview cancellation fees and refund amount
      description: Self-service cancellation closes two hours before departure. A closed window returns CANCELLATION_NOT_ALLOWED with a reason, departureAt and cutoffAt in the error details.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CancellationPreviewRequest'}}}
      responses:
        '200': {description: Preview, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationPreview'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bookings/{bookingId}/cancel:
    parameters: [{$ref: '#/components/parameters/BookingId'}]
    post:
      tags: [Booking]
      operationId: cancelBookingItems
      summary: Cancel eligible booking items
      description: The self-service cancellation deadline still applies when confirming a preview.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CancelBookingRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /bookings/{bookingId}/payments:
    parameters: [{$ref: '#/components/parameters/BookingId'}]
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment for a pending booking
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePaymentRequest'}}}
      responses:
        '201': {description: Payment, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '202': {description: Payment processing, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        default: {$ref: '#/components/responses/Error'}
    get:
      tags: [Payments]
      operationId: listBookingPayments
      summary: List payment attempts for an owned booking
      responses:
        '200': {description: Payments, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Payment'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /payments/{paymentId}:
    parameters: [{$ref: '#/components/parameters/PaymentId'}]
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get an accessible payment
      responses:
        '200': {description: Payment, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        default: {$ref: '#/components/responses/Error'}
  /payments/{paymentId}/reconcile:
    parameters: [{$ref: '#/components/parameters/PaymentId'}]
    post:
      tags: [Payments]
      operationId: reconcileSePayPayment
      summary: Check SePay for an owned payment and recover a missed confirmation
      description: An eligible payment may be checked at most once per 30 seconds across Payment instances. If SePay has not confirmed capture, the payment is unchanged.
      responses:
        '200': {description: Current payment after reconciliation, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /payments/{paymentId}/cancel:
    parameters: [{$ref: '#/components/parameters/PaymentId'}]
    post:
      tags: [Payments]
      operationId: cancelPayment
      summary: Cancel a payment that has not succeeded
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /refunds:
    get:
      tags: [Refunds]
      operationId: listMyBookingRefunds
      summary: List refund records for a booking owned by the current customer
      parameters:
        - {name: bookingId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Booking refunds, content: {application/json: {schema: {$ref: '#/components/schemas/RefundPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Request an idempotent refund
      x-permission: workload-or-tenant.refund.request-or-platform.refund.request
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateRefundRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /refunds/{refundId}:
    parameters: [{$ref: '#/components/parameters/RefundId'}]
    get:
      tags: [Refunds]
      operationId: getRefund
      summary: Get an accessible refund
      responses:
        '200': {description: Refund, content: {application/json: {schema: {$ref: '#/components/schemas/Refund'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/refunds/{refundId}/transfer:
    parameters: [{$ref: '#/components/parameters/RefundId'}]
    put:
      tags: [Refunds]
      operationId: recordRefundTransfer
      summary: Confirm a completed external transfer for a pending SePay refund
      description: Platform administrator or finance only. Matching refund, amount and transfer reference can be replayed safely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transferReference, amount]
              properties:
                transferReference: {type: string, minLength: 4, maxLength: 120, pattern: '^[A-Za-z0-9._/-]+$'}
                amount: {type: integer, format: int64, minimum: 1}
      responses:
