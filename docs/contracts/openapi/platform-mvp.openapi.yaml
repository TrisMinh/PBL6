        '200':
          description: Default page or the requested collection
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/BookingPage'}
                  - {type: array, items: {$ref: '#/components/schemas/SettlementBookingReference'}}
        default: {$ref: '#/components/responses/Error'}
