    post:
      tags: [Operator]
      operationId: listAvailableTripAssignments
      summary: List eligible vehicles and drivers for every selected occurrence
      x-permission: tenant.trip.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departureAt, arrivalAt]
              properties:
                departureAt: {type: string, format: date-time}
                arrivalAt: {type: string, format: date-time}
                endDate: {type: string, format: date, description: Inclusive end of a recurring schedule in Vietnam time.}
                weekdays: {type: array, items: {type: integer, minimum: 0, maximum: 6}, description: Required with endDate. Sunday is 0.}
      responses:
        '200':
          description: IDs in the caller's organization. Conflicts include one hour before and after each trip.
          content:
            application/json:
              schema:
                type: object
                required: [busIds, driverIds]
                properties:
                  busIds: {type: array, items: {type: string, format: uuid}}
                  driverIds: {type: array, items: {type: string, format: uuid}}
        default: {$ref: '#/components/responses/Error'}
  /operator/trips/schedule:
    get:
      tags: [Operator]
      operationId: listOperatorSchedule
      summary: Page the tenant schedule after applying local date, time, and assignment filters
      description: Status filters apply to scheduleStatus. The stored lifecycle status remains available as status.
      parameters:
        - {name: scope, in: query, description: Active trips have a future planned arrival and are neither completed nor cancelled. History contains the remaining trips., schema: {type: string, enum: [active, history, all], default: all}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: origin, in: query, schema: {type: string}}
        - {name: destination, in: query, schema: {type: string}}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: array, items: {type: string}}}
        - {name: period, in: query, schema: {type: array, items: {type: string, enum: [morning, afternoon, evening]}}}
        - {name: assignment, in: query, schema: {type: array, items: {type: string, enum: [complete, missing, conflict]}}}
        - {name: sort, in: query, schema: {type: string, enum: [earliest, latest]}}
      responses:
        '200': {description: Trip page, content: {application/json: {schema: {$ref: '#/components/schemas/TripPage'}}}}
        default: {$ref: '#/components/responses/Error'}
