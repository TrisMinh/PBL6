      tags: [Booking, Operator]
      operationId: listManifestCounts
      summary: Return booked and checked-in ticket counts per trip for the current tenant
      responses:
        '200':
          description: Manifest totals
          content: {application/json: {schema: {type: array, items: {type: object, properties: {tripId: {type: string, format: uuid}, booked: {type: integer}, checkedIn: {type: integer}}}}}}
        default: {$ref: '#/components/responses/Error'}
