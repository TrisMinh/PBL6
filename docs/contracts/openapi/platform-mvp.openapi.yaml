      operationId: findFinanceBookingReferences
      summary: Find booking references by partial code or by IDs for platform finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search: {type: string, maxLength: 100}
                organizationId: {type: string, format: uuid}
                ids: {type: array, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Matching booking IDs and codes
          content: {application/json: {schema: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, code: {type: string}}}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/payments:
    get:
      tags: [Payments]
      operationId: searchAdminPayments
      summary: Search payments in the authorized finance scope
      x-permission: tenant.payment.read-or-platform.payment.read
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: Payments, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Payments]
      operationId: listFilteredAdminPayments
      summary: Page payments after applying organization, status, and text filters
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FinanceListFilter'}}}
      responses:
        '200': {description: Filtered payments, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/refunds:
    get:
      tags: [Refunds]
      operationId: searchAdminRefunds
      summary: Search refunds in the authorized finance scope
      x-permission: tenant.refund.read-or-platform.refund.read
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: bookingId, in: query, schema: {type: string, format: uuid}}
        - {name: paymentId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Refunds, content: {application/json: {schema: {$ref: '#/components/schemas/RefundPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Refunds]
      operationId: listFilteredAdminRefunds
      summary: Page refunds after applying organization, status, and text filters
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FinanceListFilter'}}}
      responses:
        '200':
          description: Filtered refunds with parent payment references
          content: {application/json: {schema: {$ref: '#/components/schemas/FilteredRefundPage'}}}
        default: {$ref: '#/components/responses/Error'}
  /operator/refunds:
    get:
      tags: [Refunds, Operator]
      operationId: listOperatorRefunds
      summary: List refunds in the caller's finance scope, newest first
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: bookingId, in: query, schema: {type: string, format: uuid}}
        - {name: paymentId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [REQUESTED, PROCESSING, SUCCEEDED, FAILED]}}
        - {name: date, in: query, description: Request date in Vietnam., schema: {type: string, format: date}}
      responses:
        '200': {description: Refunds, content: {application/json: {schema: {$ref: '#/components/schemas/RefundPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /operator/settlements:
    get:
      tags: [Payments]
      operationId: listOperatorSettlements
      summary: List booking settlements for the current tenant
      x-permission: tenant.payment.read
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: export, in: query, description: Full settlement list for the current operator, including receipts., schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Default page or the requested collection
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/SettlementPage'}
                  - {type: array, items: {$ref: '#/components/schemas/BookingSettlement'}}
        default: {$ref: '#/components/responses/Error'}
  /operator/settlements/{settlementId}/receipt:
    put:
      tags: [Payments]
      operationId: confirmOperatorSettlementReceipt
      summary: Record receipt of a bank transfer already received by the active operator
      description: Requires the active organization's OPERATOR_ADMIN or OPERATOR_FINANCE role. A repeat of the same confirmation is safe. This action does not send money.
      parameters:
        - {name: settlementId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, amount, currency, expectedVersion]
              properties:
                reference: {type: string, minLength: 3, maxLength: 100, pattern: '^[A-Za-z0-9._/-]+$'}
                amount: {type: integer, format: int64, minimum: 1}
                currency: {$ref: '#/components/schemas/Currency'}
                expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200': {description: Recorded receipt, content: {application/json: {schema: {$ref: '#/components/schemas/SettlementReceipt'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/settlements:
    get:
      tags: [Payments]
      operationId: listAdminSettlements
      summary: List booking settlements in platform finance scope
      x-permission: platform.payment.read
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: Settlements, content: {application/json: {schema: {$ref: '#/components/schemas/SettlementPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/payouts:
    post:
      tags: [Payments]
      operationId: createOperatorPayout
      summary: Record a platform-to-operator payout for accrued prepaid net
      x-permission: platform.payment.manage
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePayoutRequest'}}}
      responses:
        '201': {description: Payout, content: {application/json: {schema: {$ref: '#/components/schemas/OperatorPayout'}}}}
        default: {$ref: '#/components/responses/Error'}
  /notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: List notifications for the current user
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Notifications, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /notifications/{notificationId}/read:
    parameters: [{$ref: '#/components/parameters/NotificationId'}]
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark an owned notification as read
      responses:
        '200': {description: Notification, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        default: {$ref: '#/components/responses/Error'}
  /operator/bookings/analytics:
    get:
      tags: [Reports]
      operationId: getOperatorBookingAnalytics
      summary: Summarize booking activity by booking date, route and payment channel
      description: Uses the active organization on the operator session. The date range is inclusive in Vietnam time.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: routeId, in: query, schema: {type: string, format: uuid}}
        - {name: channel, in: query, schema: {type: string, enum: [PREPAID, PAY_LATER]}}
        - {name: allTime, in: query, schema: {type: boolean, default: false}, description: Read all dates up to the requested end date for the active operator organization.}
      responses:
        '200':
          description: Scoped activity totals, daily trend, available routes, channel-by-route-by-date matrix and status distribution.
          content:
            application/json:
              schema:
                type: object
                required: [totals, daily, routes, matrix, statuses]
                properties:
                  totals:
                    type: object
                    required: [bookings, confirmed, customers, trips, tickets, boarded]
                    properties:
                      bookings: {type: integer, minimum: 0}
                      confirmed: {type: integer, minimum: 0}
                      customers: {type: integer, minimum: 0, description: Distinct booking accounts with valid tickets.}
                      trips: {type: integer, minimum: 0}
                      tickets: {type: integer, minimum: 0}
                      boarded: {type: integer, minimum: 0}
                  daily: {type: array, items: {type: object, required: [date, bookings, tickets, boarded]}}
                  routes: {type: array, items: {type: object, required: [id, name]}}
                  matrix: {type: array, items: {type: object, required: [date, routeId, name, channel, bookings, tickets, boarded]}}
                  statuses: {type: array, items: {type: object, required: [status, bookings]}}
        default: {$ref: '#/components/responses/Error'}
  /operator/bookings/analytics/orders:
    get:
      tags: [Reports]
      operationId: listOperatorBookingAnalyticsOrders
      summary: List orders behind an operator booking report
      description: Uses the session organization and inclusive booking dates in Vietnam time, with a maximum range of 366 days.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: routeId, in: query, schema: {type: string, format: uuid}}
        - {name: channel, in: query, schema: {type: string, enum: [PREPAID, PAY_LATER]}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING_PAYMENT, CONFIRMED, PAID, EXPIRED, CANCELLED, REFUND_PENDING, REFUNDED, COMPLETED]}}
        - {name: tickets, in: query, schema: {type: string, enum: [valid, checked-in]}}
        - {name: q, in: query, description: Case-insensitive booking code search., schema: {type: string, maxLength: 64}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: allTime, in: query, schema: {type: boolean, default: false}, description: Read all dates up to the requested end date for the active operator organization.}
      responses:
        '200':
          description: Matching order count and up to 15 orders, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer, minimum: 0}
                  items:
                    type: array
                    maxItems: 15
                    items:
                      type: object
                      required: [code, date, route, channel, status, tickets, checkedIn]
                      properties:
                        code: {type: string}
                        date: {type: string, format: date}
                        route: {type: string}
                        channel: {type: string}
                        status: {type: string}
                        tickets: {type: integer, minimum: 0}
                        checkedIn: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /reports/power-bi/embed:
    post:
      tags: [Reports]
      operationId: createPowerBiEmbedSession
      summary: Issue a read-only Power BI embed token for the active operator
      description: Uses the active organization and its finance or administrator role from the authenticated session. Takes no request body and returns Cache-Control no-store.
      x-permission: report.revenue.read
      responses:
        '200':
          description: Short-lived embed session
          content:
            application/json:
              schema:
                type: object
                required: [reportId, embedUrl, token, expiration]
                properties:
                  reportId: {type: string, format: uuid}
                  embedUrl: {type: string, format: uri}
                  token: {type: string}
                  expiration: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /reports/revenue:
    get:
      tags: [Reports]
      operationId: getRevenueReport
      summary: Get payment and settlement movements summarized by local day and currency
      description: Uses inclusive Vietnam calendar dates between from and to, with a maximum of 366 days.
      x-permission: report.revenue.read
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: timezone, in: query, required: true, schema: {const: Asia/Ho_Chi_Minh}}
        - {name: operatorOnly, in: query, schema: {type: boolean, default: false}, description: Force the active organization scope and its finance role even for dual-role users.}
        - {name: allTime, in: query, schema: {type: boolean, default: false}, description: Read all dates up to the requested end date for the active operator organization.}
      responses:
        '200': {description: Revenue report, content: {application/json: {schema: {$ref: '#/components/schemas/RevenueReport'}}}}
        default: {$ref: '#/components/responses/Error'}
  /reports/bookings:
    get:
      tags: [Reports]
      operationId: getBookingReport
      summary: Get a scoped online booking report
      x-permission: report.booking.read
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Timezone'}]
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        default: {$ref: '#/components/responses/Error'}
  /reports/occupancy:
    get:
      tags: [Reports]
      operationId: getOccupancyReport
      summary: Get a scoped online occupancy report
      x-permission: report.occupancy.read
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Timezone'}]
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        default: {$ref: '#/components/responses/Error'}
  /integrations/payments/{provider}/webhooks:
    servers:
      - url: /
    post:
      tags: [Payments]
      operationId: handlePaymentWebhook
      summary: Receive and verify a payment provider webhook
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [vnpay-sandbox]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VnPayCallback'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/VnPayCallback'}
      responses:
        '204': {description: Verified outcome persisted or duplicate acknowledged}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /integrations/payments/{provider}/return:
    servers:
      - url: /
    get:
      tags: [Payments]
      operationId: handlePaymentReturn
      summary: Verify a provider browser return before redirecting to the client result page
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [vnpay-sandbox]}}
        - {name: vnp_TmnCode, in: query, required: true, schema: {type: string}}
        - {name: vnp_TxnRef, in: query, required: true, schema: {type: string}}
        - {name: vnp_Amount, in: query, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: vnp_CurrCode, in: query, required: true, schema: {type: string, enum: [VND]}}
        - {name: vnp_ResponseCode, in: query, required: true, schema: {type: string}}
        - {name: vnp_SecureHash, in: query, required: true, schema: {type: string, minLength: 64}}
      responses:
        '302': {description: Verified return redirected to the client result page}
        '204': {description: Verified return accepted when no client return URI is supplied}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}

  /admin/retention/status:
    get:
      summary: Read local archive schedule, active job, and recent runs
      description: Available only when local retention is enabled. Requires PLATFORM_ADMIN.
      responses:
        "200":
          description: Settings, active run or null, and the most recent run manifests.
        "401":
          description: Authentication required.
        "403":
          description: Platform administrator required.
        default: {$ref: '#/components/responses/Error'}
  /admin/retention/preview:
    get:
      summary: Count eligible local archive rows without changing records
      responses:
        "200":
          description: Cutoff, eligible counts by policy, current database sizes, and estimated sizes after reclaiming space, in bytes.
        "403":
          description: Platform administrator required.
        default: {$ref: '#/components/responses/Error'}
  /admin/retention/settings:
    put:
      summary: Save the local retention policy and daily schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, days, hour]
              properties:
                enabled: { type: boolean }
                days: { type: integer, minimum: 30, maximum: 365 }
                hour: { type: integer, minimum: 0, maximum: 23, description: Hour in Vietnam local time. }
      responses:
        "200":
          description: Settings saved.
        "400":
          description: Invalid retention period or hour.
        "403":
          description: Platform administrator required.
        default: {$ref: '#/components/responses/Error'}
  /admin/retention/runs:
    post:
      summary: Queue one local archive run for all eligible data
      responses:
        "202":
          description: Queued. Poll the status endpoint using the returned run ID.
        "409":
          description: Another run is already queued or in progress.
        "403":
          description: Platform administrator required.
        default: {$ref: '#/components/responses/Error'}
  /admin/retention/runs/{id}/download:
    get:
      summary: Download all committed CSV files and the manifest as a ZIP
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ZIP archive containing the run manifest and its gzip-compressed CSV files.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403":
          description: Platform administrator required.
        "404":
          description: Run has no committed archive files or has not finished.
        default: {$ref: '#/components/responses/Error'}
  /admin/retention/runs/{id}/files/{name}:
    get:
      summary: Download a verified CSV archive from a committed batch
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Gzip-compressed CSV file.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "403":
          description: Platform administrator required.
        "404":
          description: Archive file not found.
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 200}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    UserId: {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    OrganizationId: {name: organizationId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TripId: {name: tripId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    BusId: {name: busId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    DriverId: {name: driverId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RouteId: {name: routeId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    BookingId: {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    PaymentId: {name: paymentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RefundId: {name: refundId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TicketId: {name: ticketId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    HoldToken: {name: holdToken, in: path, required: true, schema: {type: string, minLength: 20, maxLength: 300}}
    From: {name: from, in: query, required: true, schema: {type: string, format: date-time}}
    To: {name: to, in: query, required: true, schema: {type: string, format: date-time}}
    Timezone: {name: timezone, in: query, required: true, schema: {type: string, example: Asia/Ho_Chi_Minh}}
  requestBodies:
    Register:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}
    Verification:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/VerificationRequest'}}}
    ExpectedVersion:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}}}
    VersionedStatus:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/VersionedStatusRequest'}}}
  responses:
    Accepted:
      description: Command accepted
      content: {application/json: {schema: {$ref: '#/components/schemas/OperationAccepted'}}}
    Session:
      description: Session
      content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
    Error:
      description: Safe error envelope
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    Id: {type: string, format: uuid}
    DateTime: {type: string, format: date-time}
    Currency: {type: string, enum: [VND]}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: integer, format: int64, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            correlationId: {type: string, format: uuid}
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    OperationAccepted:
      type: object
      required: [operationId, status]
      properties:
        operationId: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [ACCEPTED, PROCESSING]}
        statusUrl: {type: [string, 'null']}
        refundRequestId: {type: [string, 'null'], format: uuid}
    VnPayCallback:
      type: object
      additionalProperties: true
      required: [vnp_TmnCode, vnp_TxnRef, vnp_Amount, vnp_CurrCode, vnp_ResponseCode, vnp_SecureHash]
      properties:
        vnp_TmnCode: {type: string, minLength: 1}
        vnp_TxnRef: {type: string, minLength: 1}
        vnp_Amount: {type: string, pattern: '^[0-9]+$'}
        vnp_CurrCode: {type: string, enum: [VND]}
        vnp_ResponseCode: {type: string, minLength: 2, maxLength: 10}
        vnp_TransactionNo: {type: string}
        vnp_SecureHash: {type: string, minLength: 64}
    EmailRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email, maxLength: 254}}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, password]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 150}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        password: {type: string, minLength: 10, maxLength: 128, writeOnly: true}
    VerificationRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: {$ref: '#/components/schemas/Id'}
        code: {type: string, minLength: 6, maxLength: 200, writeOnly: true}
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    RefreshRequest:
      type: object
      properties:
        refreshToken: {type: [string, 'null'], writeOnly: true, description: Mobile only; Web may use secure cookie.}
    ResetPasswordRequest:
      type: object
      required: [challengeId, code, newPassword]
      properties:
        challengeId: {$ref: '#/components/schemas/Id'}
        code: {type: string, writeOnly: true}
        newPassword: {type: string, minLength: 10, maxLength: 128, writeOnly: true}
    SessionResponse:
      type: object
