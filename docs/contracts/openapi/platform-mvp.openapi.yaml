        - {name: bookingId, in: query, required: true, schema: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}}
      responses:
        '200':
          description: Cancelled seats
          content: {application/json: {schema: {type: array, items: {type: object, properties: {bookingId: {type: string, format: uuid}, seatCode: {type: string}}}}}}
        default: {$ref: '#/components/responses/Error'}
