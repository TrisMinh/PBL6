  <style>
    *,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{padding:32px;color:#2d3142;background:#f5f5f5;font-family:'Geist',system-ui,sans-serif}
    header{max-width:1120px;margin-bottom:24px}.eyebrow{margin:0 0 8px;color:#4f5d75;font:500 8px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase}

    .diagram-shell{height:calc(100vh - 180px);min-height:520px;display:flex;flex-direction:column;background:#f5f5f5;border:1px solid rgba(45,49,66,.16);border-radius:8px;overflow:hidden}
    .diagram-toolbar{flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 12px;background:#ffffff;border-bottom:1px solid rgba(45,49,66,.12)}
    .interaction-hint{color:#4f5d75;font:500 12px 'Geist Mono',monospace;white-space:nowrap}.toolbar-actions{display:flex;align-items:center;gap:8px}.tool-button{min-width:40px;height:32px;padding:0 12px;color:#2d3142;background:#f5f5f5;border:1px solid rgba(45,49,66,.24);border-radius:6px;font:600 12px 'Geist',sans-serif;cursor:pointer}.tool-button:hover{color:#2e5aa8;border-color:#2e5aa8}.tool-button:focus-visible,.canvas:focus-visible{outline:2px solid #2e5aa8;outline-offset:-2px}.zoom-level{min-width:58px;color:#4f5d75;font:600 12px 'Geist Mono',monospace;text-align:center}.noscript-note{margin:0;padding:8px 12px;color:#4f5d75;background:rgba(169,120,20,.09);border-bottom:1px solid rgba(169,120,20,.32);font:500 12px 'Geist',sans-serif}
    .canvas{position:relative;flex:1 1 auto;min-height:0;width:100%;overflow:auto;cursor:grab;overscroll-behavior:contain;touch-action:none;scrollbar-color:#7a8399 #ececec}.canvas.is-dragging{cursor:grabbing;user-select:none}svg{display:block;width:1680px;height:auto;background:#f5f5f5}

    .title{fill:#2d3142;font:600 20px 'Geist',sans-serif}.name{fill:#2d3142;font:600 16px 'Geist',sans-serif}.name-sm{fill:#2d3142;font:600 12px 'Geist',sans-serif}.body{fill:#4f5d75;font:400 12px 'Geist',sans-serif}.mono{fill:#4f5d75;font:400 12px 'Geist Mono',monospace}.mono-xs{fill:#4f5d75;font:400 8px 'Geist Mono',monospace}.tag{fill:#7a8399;font:500 8px 'Geist Mono',monospace;letter-spacing:.12em}

  <script>
    (() => {
      const viewport = document.getElementById('diagram-viewport');
      const svg = document.getElementById('diagram-canvas');
      const zoomLevel = document.getElementById('zoom-level');
      const title = svg.querySelector(':scope > title');
      const desc = svg.querySelector(':scope > desc');
      if (title) {
        svg.setAttribute('aria-label', title.textContent || 'Diagram');
        svg.removeAttribute('aria-labelledby');
        if (desc?.id) svg.setAttribute('aria-describedby', desc.id);
        title.remove();
      }

      const baseWidth = 1680;
      const baseHeight = 900;
      const minimumZoom = .18;
      const maximumZoom = 2.5;
      let zoom = 1;
      const clamp = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));

      function updateCanvasSize() {
        svg.style.width = Math.round(baseWidth * zoom) + 'px';
        svg.style.height = Math.round(baseHeight * zoom) + 'px';
        zoomLevel.value = Math.round(zoom * 100) + '%';
        zoomLevel.textContent = zoomLevel.value;
      }

      function setZoom(nextZoom, clientX, clientY) {
        const previousZoom = zoom;
        const rect = viewport.getBoundingClientRect();
        const anchorX = clientX ?? rect.left + viewport.clientWidth / 2;
        const anchorY = clientY ?? rect.top + viewport.clientHeight / 2;
        const offsetX = anchorX - rect.left;
        const offsetY = anchorY - rect.top;
        const contentX = (viewport.scrollLeft + offsetX) / previousZoom;
        const contentY = (viewport.scrollTop + offsetY) / previousZoom;
        zoom = clamp(nextZoom, minimumZoom, maximumZoom);
        updateCanvasSize();
        viewport.scrollLeft = contentX * zoom - offsetX;
        viewport.scrollTop = contentY * zoom - offsetY;
      }

      function zoomBy(factor, clientX, clientY) { setZoom(zoom * factor, clientX, clientY); }
      function fitWidth() {
        const fittedZoom = (viewport.clientWidth - 24) / baseWidth;
        zoom = clamp(fittedZoom, minimumZoom, maximumZoom);
        updateCanvasSize();
        viewport.scrollLeft = 0;
        viewport.scrollTop = 0;
      }
      function resetView() {
        zoom = 1;
        updateCanvasSize();
        viewport.scrollLeft = 0;
        viewport.scrollTop = 0;
      }

      viewport.addEventListener('wheel', (event) => {
        event.preventDefault();
        zoomBy(clamp(Math.exp(-event.deltaY * .0015), .75, 1.25), event.clientX, event.clientY);
      }, { passive: false });
      viewport.addEventListener('dblclick', (event) => {
        event.preventDefault();
        zoomBy(1.25, event.clientX, event.clientY);
      });

      let dragPointerId = null;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragScrollLeft = 0;
      let dragScrollTop = 0;
      viewport.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        dragPointerId = event.pointerId;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        dragScrollLeft = viewport.scrollLeft;
        dragScrollTop = viewport.scrollTop;
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add('is-dragging');
        event.preventDefault();
      });
      viewport.addEventListener('pointermove', (event) => {
        if (event.pointerId !== dragPointerId) return;
        viewport.scrollLeft = dragScrollLeft - (event.clientX - dragStartX);
        viewport.scrollTop = dragScrollTop - (event.clientY - dragStartY);
      });
      function stopDragging(event) {
        if (event.pointerId !== dragPointerId) return;
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        dragPointerId = null;
        viewport.classList.remove('is-dragging');
      }
      viewport.addEventListener('pointerup', stopDragging);
      viewport.addEventListener('pointercancel', stopDragging);

      document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.2));
      document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.2));
      document.getElementById('fit-width').addEventListener('click', fitWidth);
      document.getElementById('reset-view').addEventListener('click', resetView);
      viewport.addEventListener('keydown', (event) => {
        const panStep = 96;
        if (event.key === '+' || event.key === '=') zoomBy(1.2);
        else if (event.key === '-') zoomBy(1 / 1.2);
        else if (event.key === '0') resetView();
        else if (event.key.toLowerCase() === 'f') fitWidth();
        else if (event.key === 'ArrowLeft') viewport.scrollLeft -= panStep;
        else if (event.key === 'ArrowRight') viewport.scrollLeft += panStep;
        else if (event.key === 'ArrowUp') viewport.scrollTop -= panStep;
        else if (event.key === 'ArrowDown') viewport.scrollTop += panStep;
        else return;
        event.preventDefault();
      });
      window.addEventListener('resize', () => { if (zoom < .7) fitWidth(); });
      updateCanvasSize();
      requestAnimationFrame(fitWidth);
    })();
  </script>
