services:
  postgres:
    # Windows Power BI gateway reads scoped views from the operating database.
    ports: !override ["127.0.0.1:55475:5432"]
  db-bootstrap:
    environment:
      PBL6_LEGACY_SEED: "0"
  rabbitmq:
    ports: !reset []
  redis:
    ports: !reset []
  identity:
    ports: !override ["127.0.0.1:5081:8080"]
  transport:
    ports: !override ["127.0.0.1:5082:8080"]
  booking:
    ports: !override ["127.0.0.1:5083:8080"]
  payment:
    ports: !override ["127.0.0.1:5084:8080"]
  notification:
    ports: !override ["127.0.0.1:5085:8080"]
  reporting:
    ports: !override ["127.0.0.1:5086:8080"]
    environment:
      Retention__Enabled: "true"
      Retention__Directory: /var/lib/pbl6/retention
    volumes:
      - retention-archives:/var/lib/pbl6/retention
  gateway:
    ports: !override ["127.0.0.1:5080:8080"]
  customer-web:
    ports: !override ["127.0.0.1:5173:8080"]
  operator-web:
    ports: !override ["127.0.0.1:5174:8080"]
  admin-web:
    ports: !override ["127.0.0.1:5175:8080"]
  mailpit:
    ports: !override ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  retention-archives:
