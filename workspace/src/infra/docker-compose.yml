name: pbl6-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [platform]

  db-bootstrap:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: platform
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../../../docs/database:/baseline:ro
      - ./postgres/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bootstrap-ok"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 5s
    networks: [platform]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: bus-ticket
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  payment-simulator:
    build:
      context: ./payment-simulator
    ports:
      - "8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBHOOK_URL: ${VNPAY_WEBHOOK_URL:-http://host.docker.internal:5080/integrations/payments/vnpay-sandbox/webhooks}
      HASH_SECRET: ${VNPAY_HASH_SECRET:-local-dev-only-vnpay-hash-secret-32b}
      TMN_CODE: ${VNPAY_TMN_CODE:-LOCALDEV}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  platform:
    driver: bridge
