server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # Hashed Vite assets are immutable. Missing assets must return 404, not HTML.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    expires -1;
  }

  location = /__spa-fallback.html {
    expires -1;
  }

  # Home is prerendered; every other React Router route needs the SPA document.
  location / {
    try_files $uri $uri/ /__spa-fallback.html;
  }
}
