# A hard refresh sends no-cache. Mark only HTML responses, never API or assets.
map "$uri|$http_cache_control|$http_pragma" $blue_startup_cookie {
  default "";
  "~*^/(index|__spa-fallback)\\.html\\|.*no-cache" "blue-startup-force=1; Path=/; Max-Age=15; SameSite=Lax";
}
map "$request_method:$uri" $blue_signup_ip {
  default "";
  ~*^POST:/api/v1/auth/register/?$ $binary_remote_addr;
}
map "$request_method:$uri" $blue_hold_ip {
  default "";
  ~*^POST:/api/v1/trips/[^/]+/seat-holds/?$ $binary_remote_addr;
  ~*^PUT:/api/v1/seat-holds/[^/]+$ $binary_remote_addr;
}
limit_req_zone $blue_signup_ip zone=blue_signup:1m rate=10r/m;
limit_req_zone $blue_hold_ip zone=blue_hold:1m rate=90r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Docker service IPs can change when a backend container is recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  set $blue_gateway http://gateway:8080;
  add_header Set-Cookie $blue_startup_cookie always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req_status 429;
    limit_req zone=blue_signup burst=10 nodelay;
    limit_req zone=blue_hold burst=40 nodelay;
    include /etc/nginx/gateway-proxy.inc;
  }

  location ~ ^/api/v1/admin/(payments|refunds)$ {
    client_max_body_size 8m;
    include /etc/nginx/gateway-proxy.inc;
  }

  # Public server-to-server SePay IPN. Never serve the SPA document for this route.
  location = /integrations/payments/sepay/ipn {
    client_max_body_size 64k;
    proxy_pass $blue_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Signed public bridge for SePay checkout started on localhost.
  location = /integrations/payments/sepay/browser-return {
    proxy_pass $blue_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Hashed Vite assets are immutable. Missing assets must return 404, not HTML.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    expires -1;
  }

  # The live build uses a single React Router SPA document for all page routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
