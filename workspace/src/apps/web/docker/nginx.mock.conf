# A hard refresh sends no-cache. Mark only HTML responses, never API or assets.
map "$uri|$http_cache_control|$http_pragma" $blue_startup_cookie {
  default "";
  "~*^/(index|__spa-fallback)\\.html\\|.*no-cache" "blue-startup-force=1; Path=/; Max-Age=15; SameSite=Lax";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header Set-Cookie $blue_startup_cookie always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location = /mockServiceWorker.js { expires -1; }
  location = /index.html { expires -1; }
  location = /__spa-fallback.html { expires -1; }
  location / { try_files $uri $uri/ /__spa-fallback.html; }
}
