<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --rule: rgba(45, 49, 66, 0.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }
    main { width: min(100%, 640px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Flowchart · Authentication</p>
    <h1>Login flow</h1>

    <svg viewBox="0 0 640 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="login-flowchart-title login-flowchart-desc">
      <title id="login-flowchart-title">Login flow</title>
      <desc id="login-flowchart-desc">A linear flow that moves from Start to Login, then Dashboard, and finally End.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="640" height="624" fill="#f5f5f5"/>

      <!-- Connectors are painted before nodes. -->
      <line x1="320" y1="128" x2="320" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="264" x2="320" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="400" x2="320" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Start -->
      <rect x="240" y="64" width="160" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="64" width="160" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="100" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Start</text>

      <!-- Login -->
      <rect x="240" y="200" width="160" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="240" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="236" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Login</text>

      <!-- Dashboard: single focal node -->
      <rect x="240" y="336" width="160" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="240" y="336" width="160" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="320" y="372" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Dashboard</text>

      <!-- End -->
      <rect x="240" y="472" width="160" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="472" width="160" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="508" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">End</text>

      <!-- Legend -->
      <line x1="40" y1="568" x2="600" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.16em">LEGEND</text>
      <rect x="120" y="580" width="24" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="152" y="592" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8">Start / end</text>
      <rect x="288" y="580" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="592" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8">Action</text>
    </svg>
  </main>
</body>
</html>
